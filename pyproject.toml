[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchpilot"
dynamic = ["version"]
description = "Review a git diff with the Claude API and generate pytest tests for the changed code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.14,<3",
    "httpx2>=2.16,<3",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "typer>=0.29,<1",
]

[project.scripts]
patchpilot = "patchpilot.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "ruff>=0.17,<0.18",
]

[tool.hatch.version]
path = "src/patchpilot/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports, undefined names
    "I",   # import sorting
    "UP",  # prefer modern Python syntax
    "B",   # bugbear: likely bugs
    "SIM", # simplifiable code
    "ANN", # missing type annotations
]
