[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchpilot"
dynamic = ["version"]
description = "Review a git diff with a language model and generate pytest tests for the changed code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.14,<3",
    "fastapi>=0.165,<1",  # the web page
    "httpx2>=2.16,<3",
    "openai>=3.60,<4",  # client for NVIDIA's OpenAI-compatible API
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "pytest>=9,<10",  # runs the generated tests
    "typer>=0.29,<1",
]

[project.scripts]
patchpilot = "patchpilot.cli:app"

[project.optional-dependencies]
web = [
    "uvicorn>=0.54,<1",  # runs the web page outside serverless hosts
]
dev = [
    "patchpilot[web]",
    "ruff>=0.17,<0.18",
]

# Static files must be served by the app, not a CDN: the app adds the security headers that
# stop code under test from calling it.
[tool.vercel.fastapi.static]
cdn = false

[tool.hatch.version]
path = "src/patchpilot/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# The eval cases contain bugs on purpose.
extend-exclude = ["eval/cases"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports, undefined names
    "I",   # import sorting
    "UP",  # prefer modern Python syntax
    "B",   # bugbear: likely bugs
    "SIM", # simplifiable code
    "ANN", # missing type annotations
]
